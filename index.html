<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Draw</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f1eee8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Draw">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="board">
    <canvas id="paper"></canvas>
    <div id="caret" hidden></div>
  </main>

  <!-- letter keyboard, shown while the ABC tool is on; keys are added by app.js -->
  <div id="keys" hidden aria-label="Letters and numbers"></div>

  <nav id="panel" aria-label="Drawing tools">
    <button type="button" class="btn action" data-action="undo" aria-label="Undo">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M24 16 L12 28 L24 40" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 28 H38 A14 14 0 0 1 38 56 H28" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </button>

    <button type="button" class="btn tool" data-tool="crayon" aria-label="Crayon">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path class="ink" d="M26 19 L30.2 6.5 Q32 3 33.8 6.5 L38 19 Z"/>
        <rect class="ink" x="24" y="18" width="16" height="44" rx="3"/>
        <rect x="24" y="26" width="16" height="28" fill="#000" opacity=".22"/>
        <path d="M24 31.5h16M24 48.5h16" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
      </svg>
    </button>

    <button type="button" class="btn tool" data-tool="pencil" aria-label="Pencil">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M25 23 L32 4 L39 23 Z" fill="#f0c48e"/>
        <path class="ink" d="M29.1 11.9 L32 4 L34.9 11.9 Z"/>
        <rect class="ink" x="25" y="22" width="14" height="40" rx="2"/>
        <path d="M29.7 22v40M34.3 22v40" stroke="#000" stroke-opacity=".18" stroke-width="1.5"/>
      </svg>
    </button>

    <button type="button" class="btn tool" data-tool="marker" aria-label="Marker">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path class="ink" d="M27.5 25 L29 11 Q32 4 35 11 L36.5 25 Z"/>
        <rect x="22.5" y="22" width="19" height="40" rx="6" fill="#f7f7f7" stroke="#000" stroke-opacity=".18" stroke-width="1.5"/>
        <rect class="ink" x="22.5" y="31" width="19" height="11"/>
      </svg>
    </button>

    <button type="button" class="btn tool" data-tool="eraser" aria-label="Eraser">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <g transform="rotate(-28 32 34)">
          <path d="M19 20 Q19 12 27 12 H37 Q45 12 45 20 V36 H19 Z" fill="#ff9fb4"/>
          <path d="M19 36 H45 V54 Q45 60 39 60 H25 Q19 60 19 54 Z" fill="#3f7be0"/>
          <path d="M19 36 H45" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
        </g>
      </svg>
    </button>

    <button type="button" class="btn tool" data-tool="abc" aria-label="Letters">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <g transform="rotate(12 44 22)">
          <rect x="31" y="9" width="26" height="26" rx="6" fill="#35b6f0"/>
          <text x="44" y="30" text-anchor="middle" class="glyph" font-size="19">b</text>
        </g>
        <rect class="ink" x="7" y="24" width="34" height="34" rx="8" stroke="#000" stroke-opacity=".15" stroke-width="1.5"/>
        <text x="24" y="50" text-anchor="middle" class="glyph" font-size="26">A</text>
      </svg>
    </button>

    <button type="button" class="btn action" data-action="clear" aria-label="Clear page">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M14 18 H50" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
        <path d="M26 17 V12 Q26 9 29 9 H35 Q38 9 38 12 V17" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
        <path d="M18 24 L21 54 Q21.5 58 25.5 58 H38.5 Q42.5 58 43 54 L46 24 Z" fill="currentColor"/>
      </svg>
    </button>

    <!-- colour swatches are added by app.js -->
  </nav>

  <script src="app.js"></script>
</body>
</html>
