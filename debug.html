<!doctype html>
<html lang="en">
<head>
  <!-- Temporary test page for the iOS home-screen bottom strip. Same meta tags as index.html, no manifest. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Draw test</title>
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Draw test">
  <style>
    html { background: #ff00ff; height: 100%; overflow: hidden; }
    body { margin: 0; position: fixed; inset: 0; background: #003; color: #fff;
           font: 15px/1.35 -apple-system, system-ui, sans-serif; }
    .bar { position: fixed; top: 0; width: 18%; }
    #lvh { left: 0;   height: 100lvh; background: #0c0; }
    #vh  { left: 20%; height: 100vh;  background: #f80; }
    #dvh { left: 40%; height: 100dvh; background: #ee0; }
    #pct { left: 60%; bottom: 0;      background: #0cf; }
    .bar b { position: absolute; bottom: 4px; left: 4px; color: #000; }
    #info { position: absolute; left: 82%; right: 0; top: 60px; font-size: 12px; }
    #report { position: fixed; left: 8px; right: 8px; top: 35%; background: rgba(0,0,0,.75);
              padding: 10px; border-radius: 10px; white-space: pre; font: 13px/1.4 ui-monospace, Menlo, monospace; }
    .probe { position: fixed; visibility: hidden; top: 0; }
  </style>
</head>
<body>
  <div class="bar" id="lvh"><b>lvh</b></div>
  <div class="bar" id="vh"><b>vh</b></div>
  <div class="bar" id="dvh"><b>dvh</b></div>
  <div class="bar" id="pct"><b>fixed</b></div>
  <div id="report"></div>
  <div class="probe" id="pTop" style="height: env(safe-area-inset-top)"></div>
  <div class="probe" id="pBot" style="height: env(safe-area-inset-bottom)"></div>
  <script>
    const h = (id) => Math.round(document.getElementById(id).getBoundingClientRect().height);
    function report() {
      document.getElementById('report').textContent = [
        'standalone: ' + (navigator.standalone === true) + ' / ' + matchMedia('(display-mode: standalone)').matches,
        'screen: ' + screen.width + 'x' + screen.height,
        'innerHeight: ' + innerHeight + '  outer: ' + outerHeight,
        'clientHeight: ' + document.documentElement.clientHeight,
        'visualViewport: ' + (window.visualViewport ? Math.round(visualViewport.height) : '-'),
        'lvh ' + h('lvh') + ' | vh ' + h('vh') + ' | dvh ' + h('dvh') + ' | fixed ' + h('pct'),
        'safe-area top ' + h('pTop') + ' | bottom ' + h('pBot'),
        navigator.userAgent.replace(/^Mozilla\/5.0 /, '').slice(0, 60),
      ].join('\n');
    }
    report();
    addEventListener('resize', report);
    setTimeout(report, 500);
  </script>
</body>
</html>
